name: FULL CI PIPELINE (Backend + Frontend + API + Perf + UI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ----------------------------------------------------
  # JOB 1 — Unit Test + Karate API Test (H2 Database)
  # ----------------------------------------------------
  test-h2:
    name: 🧪 Unit + API Tests (H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Run Unit Tests
        working-directory: backend
        run: mvn --batch-mode test
        continue-on-error: true

      - name: Run Karate API Tests
        working-directory: backend
        run: mvn --batch-mode -Dtest=ApiTestRunner test
        continue-on-error: true
      
      - name: Run Karate Database Tests
        working-directory: backend
        run: mvn --batch-mode -Dtest=DatabaseTestRunner test
        continue-on-error: true

      - name: Upload H2 Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-h2
          path: |
            backend/target/surefire-reports/
            backend/target/karate-reports/


  # ----------------------------------------------------
  # JOB 2 — Performance Test (MySQL Docker)
  # ----------------------------------------------------
  test-mysql:
    name: 🚀 Performance Tests (MySQL Docker)
    runs-on: ubuntu-latest
    needs: test-h2

    container:
      image: maven:3.9.6-eclipse-temurin-17

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: employee_management
          MYSQL_USER: springstudent
          MYSQL_PASSWORD: springstudent
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install netcat
        run: apt-get update && apt-get install -y netcat

      # ------------------------
      # Build Backend
      # ------------------------
      - name: Build Backend
        working-directory: backend
        run: mvn -DskipTests package

      # ------------------------
      # Wait for MySQL
      # ------------------------
      - name: Wait for MySQL
        run: |
          echo "⏳ Waiting for MySQL to become ready..."
          for i in {1..20}; do
            nc -z mysql 3306 && echo "✅ MySQL is UP!" && break
            echo "MySQL not ready yet..."
            sleep 2
          done

      # ------------------------
      # Start Backend
      # ------------------------
      - name: Start Backend (application-docker.properties)
        working-directory: backend
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=docker > app.log 2>&1 &
          sleep 15
          tail -n 50 app.log
          nc -z localhost 8080 || (echo "❌ Backend FAILED!" && exit 1)
          echo "✅ Backend running on port 8080"

      # ------------------------
      # Run Performance Tests
      # ------------------------
      - name: Run Performance Tests (Gatling + Karate)
        working-directory: backend
        run: mvn --batch-mode -Dtest=PerformanceTestRunner test
        continue-on-error: true

      # ------------------------
      # Upload Reports
      # ------------------------
      - name: Upload Performance Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-perf
          path: |
            backend/results/
            backend/target/gatling/
            backend/target/karate-reports/
            backend/app.log


 