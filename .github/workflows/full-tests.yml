name: FULL TEST SUITE (Unit + API + Perf + UI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  full-tests:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # CHECKOUT CODE
      # -------------------------------
      - name: Checkout Code
        uses: actions/checkout@v3

      # -------------------------------
      # SETUP JAVA FOR BACKEND
      # -------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # -------------------------------
      # BUILD BACKEND
      # -------------------------------
      - name: Build Backend
        working-directory: backend
        run: mvn -DskipTests package

      # -------------------------------
      # START BACKEND SERVER
      # -------------------------------
      - name: Start Backend Server
        working-directory: backend
        run: |
          nohup java -jar target/*.jar &
          sleep 10

      # -------------------------------
      # SETUP NODE FOR FRONTEND
      # -------------------------------
      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # -------------------------------
      # INSTALL + BUILD FRONTEND
      # -------------------------------
      - name: Install + Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # -------------------------------
      # START FRONTEND SERVER
      # -------------------------------
      - name: Start Frontend Server
        working-directory: frontend
        run: |
          nohup npm run start &
          sleep 10

      # -------------------------------
      # RUN UNIT + KARATE TESTS
      # -------------------------------
      - name: Run Unit + Karate Tests
        working-directory: backend
        run: mvn --batch-mode -Dsurefire.includes=**/*Test.java,**/*TestRunner.java test

      # -------------------------------
      # RUN PERFORMANCE TEST (GATLING)
      # -------------------------------
      - name: Run Gatling Performance Test
        working-directory: backend
        run: mvn gatling:test

      # -------------------------------
      # RUN UI TESTS (CYPRESS)
      # -------------------------------
      - name: Install Cypress
        working-directory: frontend
        run: |
          npm install cypress --save-dev
          npx cypress run

      # -------------------------------
      # ARCHIVE TEST REPORTS
      # -------------------------------
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/karate-reports/
            backend/target/gatling/
            frontend/cypress/reports/
